services:
  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    ports:
      - "${DB_BIND_IP:-0.0.0.0}:3306:3306"
    env_file:
      - ${ENV_FILE:-.env}
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  mariadb-data:

services:
  was:
    build:
      context: ../../apps/integrated-was
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${WAS_BIND_IP:-0.0.0.0}:8000:8000"
    env_file:
      - ${ENV_FILE:-.env}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

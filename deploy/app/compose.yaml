services:
  gateway:
    image: nginx:1.26-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_BIND_IP:-0.0.0.0}:${HTTP_PORT:-80}:80"
    volumes:
      - ./gateway/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      service-web:
        condition: service_healthy
      admin-web:
        condition: service_healthy
      was:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  service-web:
    build:
      context: ../../apps/service-web
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5

  admin-web:
    build:
      context: ../../apps/admin-web
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/admin/"]
      interval: 10s
      timeout: 3s
      retries: 5

  was:
    build:
      context: ../../apps/integrated-was
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - ${ENV_FILE:-.env}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  kma-collector:
    build:
      context: ../../apps/integrated-was
      dockerfile: Dockerfile
    profiles: ["collector"]
    command: python -m app.jobs.collect_kma
    env_file:
      - ${ENV_FILE:-.env}

version: '3.8'

services:
  # 👑 1. 최전방 L4 로드밸런서 (Nginx)
  l4-lb:
    image: nginx:1.26-alpine
    container_name: proxy_server
    restart: unless-stopped
    ports:
      - "${HTTP_BIND_IP:-0.0.0.0}:${HTTP_PORT:-80}:80"  # 외부 고객용 포트 (기본 80)
      - "443:443"
      - "8080:8080"                                      # 사내 직원용 포트
    volumes:
      - ./gateway/default.conf:/etc/nginx/nginx.conf:ro
      - /dev/null:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      service-web:
        condition: service_healthy
      admin-web:
        condition: service_healthy
      was:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    networks:
      - app-network

  # 👥 2. 외부 고객용 Web (service-web)
  service-web:
    build:
      context: ../../apps/service-web
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    networks:
      - app-network

  # 🏢 3. 사내 직원용 Web (admin-web)
  admin-web:
    build:
      context: ../../apps/admin-web
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/admin/"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    networks:
      - app-network

  # 🚀 4. 백엔드 통합 WAS 서버 그룹
  was:
    build:
      context: ../../apps/integrated-was
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      - DB_HOST=10.250.10.10   # 💡 요청하신 고정 DB 주소
      - DB_PORT=3306           # 💡 MySQL 포트로 변경
    depends_on:
      - redis
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    networks:
      - app-network

  # 🌤️ 5. 기상청 날씨 데이터 수집기 (배포 프로필 필요시 동작)
  kma-collector:
    build:
      context: ../../apps/integrated-was
      dockerfile: Dockerfile
    profiles: ["collector"]
    command: python -m app.jobs.collect_kma
    env_file:
      - ${ENV_FILE:-.env}
    depends_on:
      - redis
    networks:
      - app-network

  # 🔑 6. 세션 공유 및 캐싱용 중앙 Redis
  redis:
    image: redis:7-alpine
    container_name: session_redis
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
    ipam:
      config:
        - subnet: 10.80.10.0/24

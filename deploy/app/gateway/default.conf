user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 💡 Docker 내부 DNS 서버 주소 (이름 해석용)
    resolver 127.0.0.11 valid=5s;

    # 🚀 백엔드 Python WAS 서비스 그룹 정의 (포트 8000)
    upstream was_backend {
        server was:8000;
        keepalive 32;
    }

    # 👥 외부 고객용 웹 앱 그룹 정의
    upstream service_web_backend {
        server service-web:80;
    }

    # 🏢 사내 직원용 웹 앱 그룹 정의
    upstream admin_web_backend {
        server admin-web:80;
    }

    server {
        listen 80;
        server_name tripkey.shop www.tripkey.shop;

        # 🏥 L4 로드밸런서 헬스체크용 엔드포인트
        location = /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # 1️⃣ 동적 API 요청 -> Python WAS 프록시 라우팅 (/api/)
        location /api/ {
            set $backend_was "http://was_backend";
            proxy_pass $backend_was;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 3s;
            proxy_read_timeout 60s;
        }

        # 2️⃣ 사내 직원용 웹 -> admin-web 라우팅 (/admin/)
        location /admin/ {
            set $backend_admin "http://admin_web_backend";
            proxy_pass $backend_admin;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 3️⃣ 루트 기본 요청 -> 외부 고객용 service-web 라우팅 (/)
        location / {
            set $backend_service "http://service_web_backend";
            proxy_pass $backend_service;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

services:
  gateway:
    image: nginx:1.26-alpine
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env}
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./gateway/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      service-web:
        condition: service_healthy
      admin-web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  service-web:
    image: ${ECR_REGISTRY}/inframodel-service-web:${IMAGE_TAG}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5

  admin-web:
    image: ${ECR_REGISTRY}/inframodel-admin-web:${IMAGE_TAG}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/admin/"]
      interval: 10s
      timeout: 3s
      retries: 5

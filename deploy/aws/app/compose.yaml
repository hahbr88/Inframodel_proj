services:
  gateway:
    image: nginx:1.26-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./gateway/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      service-web:
        condition: service_healthy
      admin-web:
        condition: service_healthy
      was:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  service-web:
    image: ${ECR_REGISTRY}/inframodel-service-web:${IMAGE_TAG:-v1.0}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5

  admin-web:
    image: ${ECR_REGISTRY}/inframodel-admin-web:${IMAGE_TAG:-v1.0}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/admin/"]
      interval: 10s
      timeout: 3s
      retries: 5

  was:
    image: ${ECR_REGISTRY}/inframodel-was:${IMAGE_TAG:-v1.0}
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - ${ENV_FILE:-.env}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  kma-collector:
    image: ${ECR_REGISTRY}/inframodel-was:${IMAGE_TAG:-v1.0}
    profiles: ["collector"]
    command: python -m app.jobs.collect_kma
    env_file:
      - ${ENV_FILE:-.env}
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  redis-data:

services:
  galera-node1:
    build:
      context: .
      dockerfile: Dockerfile
    image: three-tier-mariadb-galera:11.8.8
    container_name: galera-node1
    hostname: galera-node1
    restart: unless-stopped
    stop_grace_period: 2m
    environment:
      TZ: Asia/Seoul
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/mariadb_root_password
      MARIADB_ROOT_HOST: localhost
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_USER_HOST: "%"
      MARIADB_PASSWORD_FILE: /run/secrets/mariadb_app_password
      MARIADB_AUTO_UPGRADE: "1"
      GALERA_BOOTSTRAP: ${GALERA_BOOTSTRAP_NODE1:-0}
    secrets:
      - mariadb_root_password
      - mariadb_app_password
      - mariadb_sst_password
    volumes:
      - galera_node1_data:/var/lib/mysql
      - ./config/60-galera-common.cnf:/etc/mysql/conf.d/60-galera-common.cnf:ro
      - ./config/61-node1.cnf:/etc/mysql/conf.d/61-node.cnf:ro
    ports:
      - "${DB_BIND_IP:-0.0.0.0}:3306:3306"
    networks:
      galera_net:
        ipv4_address: 172.30.0.11
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          healthcheck.sh --connect --innodb_initialized &&
          test "$$(mariadb --protocol=socket -uroot -p"$$(cat /run/secrets/mariadb_root_password)" -Nse
          "SELECT CONCAT((SELECT VARIABLE_VALUE FROM information_schema.GLOBAL_STATUS WHERE VARIABLE_NAME='WSREP_READY'),':',(SELECT VARIABLE_VALUE FROM information_schema.GLOBAL_STATUS WHERE VARIABLE_NAME='WSREP_CONNECTED'),':',(SELECT VARIABLE_VALUE FROM information_schema.GLOBAL_STATUS WHERE VARIABLE_NAME='WSREP_LOCAL_STATE_COMMENT'));" 2>/dev/null)" = "ON:ON:Synced"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  galera-node2:
    build:
      context: .
      dockerfile: Dockerfile
    image: three-tier-mariadb-galera:11.8.8
    container_name: galera-node2
    hostname: galera-node2
    restart: unless-stopped
    stop_grace_period: 2m
    environment:
      TZ: Asia/Seoul
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/mariadb_root_password
      MARIADB_ROOT_HOST: localhost
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_USER_HOST: "%"
      MARIADB_PASSWORD_FILE: /run/secrets/mariadb_app_password
      MARIADB_AUTO_UPGRADE: "1"
      GALERA_BOOTSTRAP: "0"
    secrets:
      - mariadb_root_password
      - mariadb_app_password
      - mariadb_sst_password
    volumes:
      - galera_node2_data:/var/lib/mysql
      - ./config/60-galera-common.cnf:/etc/mysql/conf.d/60-galera-common.cnf:ro
      - ./config/61-node2.cnf:/etc/mysql/conf.d/61-node.cnf:ro
    ports:
      - "${DB_BIND_IP:-0.0.0.0}:3307:3306"
    networks:
      galera_net:
        ipv4_address: 172.30.0.12
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          healthcheck.sh --connect --innodb_initialized &&
          test "$$(mariadb --protocol=socket -uroot -p"$$(cat /run/secrets/mariadb_root_password)" -Nse
          "SELECT CONCAT((SELECT VARIABLE_VALUE FROM information_schema.GLOBAL_STATUS WHERE VARIABLE_NAME='WSREP_READY'),':',(SELECT VARIABLE_VALUE FROM information_schema.GLOBAL_STATUS WHERE VARIABLE_NAME='WSREP_CONNECTED'),':',(SELECT VARIABLE_VALUE FROM information_schema.GLOBAL_STATUS WHERE VARIABLE_NAME='WSREP_LOCAL_STATE_COMMENT'));" 2>/dev/null)" = "ON:ON:Synced"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  galera-node3:
    build:
      context: .
      dockerfile: Dockerfile
    image: three-tier-mariadb-galera:11.8.8
    container_name: galera-node3
    hostname: galera-node3
    restart: unless-stopped
    stop_grace_period: 2m
    environment:
      TZ: Asia/Seoul
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/mariadb_root_password
      MARIADB_ROOT_HOST: localhost
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_USER_HOST: "%"
      MARIADB_PASSWORD_FILE: /run/secrets/mariadb_app_password
      MARIADB_AUTO_UPGRADE: "1"
      GALERA_BOOTSTRAP: "0"
    secrets:
      - mariadb_root_password
      - mariadb_app_password
      - mariadb_sst_password
    volumes:
      - galera_node3_data:/var/lib/mysql
      - ./config/60-galera-common.cnf:/etc/mysql/conf.d/60-galera-common.cnf:ro
      - ./config/61-node3.cnf:/etc/mysql/conf.d/61-node.cnf:ro
    ports:
      - "${DB_BIND_IP:-0.0.0.0}:3308:3306"
    networks:
      galera_net:
        ipv4_address: 172.30.0.13
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          healthcheck.sh --connect --innodb_initialized &&
          test "$$(mariadb --protocol=socket -uroot -p"$$(cat /run/secrets/mariadb_root_password)" -Nse
          "SELECT CONCAT((SELECT VARIABLE_VALUE FROM information_schema.GLOBAL_STATUS WHERE VARIABLE_NAME='WSREP_READY'),':',(SELECT VARIABLE_VALUE FROM information_schema.GLOBAL_STATUS WHERE VARIABLE_NAME='WSREP_CONNECTED'),':',(SELECT VARIABLE_VALUE FROM information_schema.GLOBAL_STATUS WHERE VARIABLE_NAME='WSREP_LOCAL_STATE_COMMENT'));" 2>/dev/null)" = "ON:ON:Synced"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

secrets:
  mariadb_root_password:
    file: ./secrets/root_password.txt
  mariadb_app_password:
    file: ./secrets/app_password.txt
  mariadb_sst_password:
    file: ./secrets/sst_password.txt

volumes:
  galera_node1_data:
    name: galera-node1-data
  galera_node2_data:
    name: galera-node2-data
  galera_node3_data:
    name: galera-node3-data

networks:
  galera_net:
    name: galera-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1

global
    log stdout format raw local0
    maxconn 2048

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 2s
    timeout client 30s
    timeout server 30s

frontend mysql_write
    bind *:3306
    default_backend mysql_write_path

backend mysql_write_path
    mode tcp
    balance first
    option mysql-check user haproxy_check
    default-server inter 1s fall 2 rise 1 on-marked-down shutdown-sessions
    server db1 192.168.100.30:3306 check
    server db2 192.168.100.40:3306 check backup
    server db3 192.168.100.50:3306 check backup

frontend mysql_read
    bind *:3307
    default_backend mysql_read_path

backend mysql_read_path
    mode tcp
    balance first
    option mysql-check user haproxy_check
    default-server inter 1s fall 2 rise 1 on-marked-down shutdown-sessions
    server db2 192.168.100.40:3306 check
    server db3 192.168.100.50:3306 check backup
    server db1 192.168.100.30:3306 check backup

listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /
    stats refresh 5s

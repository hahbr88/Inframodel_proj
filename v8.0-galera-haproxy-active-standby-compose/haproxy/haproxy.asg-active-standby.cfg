global
    log stdout format raw local0
    maxconn 4096

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 5s
    timeout client 50s
    timeout server 50s

frontend mysql_write
    bind *:3306
    default_backend mysql_write_path

backend mysql_write_path
    mode tcp
    balance first
    option mysql-check user healthcheck
    default-server inter 2s fall 3 rise 2 on-marked-down shutdown-sessions
    server node1 ${DB1_IP}:3306 check
    server node2 ${DB2_IP}:3306 check backup
    server node3 ${DB3_IP}:3306 check backup

frontend mysql_read
    bind *:3307
    default_backend mysql_read_path

backend mysql_read_path
    mode tcp
    balance first
    option mysql-check user healthcheck
    default-server inter 2s fall 3 rise 2 on-marked-down shutdown-sessions
    server node2 ${DB2_IP}:3306 check
    server node3 ${DB3_IP}:3306 check backup
    server node1 ${DB1_IP}:3306 check backup

listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /
    stats refresh 5s

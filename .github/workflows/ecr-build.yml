name: Build and Push App Images to ECR

on:
  push:
    branches:
      - aws-ecr
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-northeast-2

jobs:
  build-and-push:
    name: Build and push Docker images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Prepare image tags
        run: |
          REF_SLUG="$(printf '%s' "${GITHUB_REF_NAME}" | tr '/_' '--' | tr -cd '[:alnum:].-')"
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "IMAGE_TAG=${REF_SLUG}-${SHORT_SHA}" >> "$GITHUB_ENV"

      - name: Build and push service-web
        uses: docker/build-push-action@v6
        with:
          context: apps/service-web
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/inframodel-service-web:${{ env.IMAGE_TAG }}
            ${{ steps.login-ecr.outputs.registry }}/inframodel-service-web:stable

      - name: Build and push admin-web
        uses: docker/build-push-action@v6
        with:
          context: apps/admin-web
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/inframodel-admin-web:${{ env.IMAGE_TAG }}
            ${{ steps.login-ecr.outputs.registry }}/inframodel-admin-web:stable

      - name: Build and push was
        uses: docker/build-push-action@v6
        with:
          context: apps/integrated-was
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/inframodel-was:${{ env.IMAGE_TAG }}
            ${{ steps.login-ecr.outputs.registry }}/inframodel-was:stable

      - name: Print deployment tag
        run: |
          echo "Pushed image tag: ${IMAGE_TAG}"
          echo "Use IMAGE_TAG=${IMAGE_TAG} in deploy/aws/app/.env for a pinned deployment."

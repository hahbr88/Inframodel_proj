# 이 컴포즈 파일은 포멧터 동작 확인을 위한 예시입니다.

# 컴포즈 파일 문법 버전 명시 (최신 도커 사양 적용 시 생략 가능)
version: "3.8"

# 실행할 컨테이너(서비스) 목록 정의 시작
services:
  # 데이터베이스 역할을 할 첫 번째 컨테이너 서비스명 지정
  db:
    # 맥(ARM) 및 인텔 환경 모두 호환되는 최신 MariaDB 이미지 사용
    image: mariadb:latest

    # 컨테이너 고유 이름을 'wp-db'로 고정
    container_name: wp-db
    # 수동으로 끄기 전까지 컨테이너 다운 시 자동 재시작
    restart: unless-stopped

    # 내부 환경변수 설정 시작
    environment:
      # 최고 관리자(root) 계정 비밀번호 설정
      MARIADB_ROOT_PASSWORD: 1234
      # 초기 구동 시 자동 생성될 데이터베이스 이름 지정
      MARIADB_DATABASE: wordpress
    # 데이터 보존을 위한 저장소 연결
    volumes:
      # 생성한 db-data 볼륨을 DB 실제 데이터 경로에 매핑
      - db-data:/var/lib/mysql

    # 컨테이너 소속 가상 네트워크 지정
    networks:
      # 독립된 네트워크 공간인 wp-net 가상 스위치에 연결
      - wp-net

  # 웹 애플리케이션 역할을 할 두 번째 컨테이너 서비스명 지정
  wordpress:
    # 공식 최신 워드프레스 웹 서버 이미지 사용
    image: wordpress:latest
    # 컨테이너 고유 이름을 'wp-web'으로 고정
    container_name: wp-web
    # 수동으로 중지하기 전까지 예기치 못한 에러 시 자동 재시작

    restart: unless-stopped
    # 컨테이너 간 구동 순서 의존성 정의
    depends_on:
      # db 서비스가 먼저 생성 및 실행된 후 워드프레스 웹 서버 시작
      - db
    # 외부 접속을 위한 포트 포워딩 설정
    ports:
      # 호스트 PC의 8088 포트로 접속 시 컨테이너 내부 80번 포트로 연결
      - "8088:80"
    # 워드프레스 애플리케이션 DB 연동 정보 설정
    environment:
      # 같은 네트워크 안에서 db 서비스 이름과 포트로 자동 DNS 조회 통신
      WORDPRESS_DB_HOST: db:3306
      # DB 접속 계정 이름을 root로 지정
      WORDPRESS_DB_USER: root
      # db 서비스에 지정한 패스워드와 일치시킴

      WORDPRESS_DB_PASSWORD: 1234
      # 데이터를 읽고 쓸 데이터베이스 명시
      WORDPRESS_DB_NAME: wordpress
    # 웹 소스 코드 및 업로드 데이터 보존
    volumes:
      # 생성한 wp-data 볼륨을 워드프레스 웹 루트 경로에 매핑
      - wp-data:/var/www/html
    # db 컨테이너와 동일한 가상 네트워크 지정
    networks:
      # 같은 가상 스위치에 물려 IP가 아닌 서로의 이름으로 통신 가능
      - wp-net

# 컴포즈 파일에서 통합 관리할 도커 내부 볼륨 영역 정의
volumes:
  # DB 데이터 영구 저장을 위한 공유 볼륨 생성
  db-data:
  # 워드프레스 웹 리소스(업로드 이미지, 테마 등) 보존용 볼륨 생성
  wp-data:

# 컨테이너 간 격리 및 내부 통신을 위한 가상 네트워크 정의
networks:
  # 워드프레스 패키지 전용 가상 네트워크 이름 정의

  wp-net:
    # 단일 호스트 기본 가상 스위치 모드인 브릿지(bridge) 드라이버 사용
    driver: bridge

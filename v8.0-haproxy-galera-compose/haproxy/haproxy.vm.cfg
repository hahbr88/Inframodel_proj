global
    log stdout format raw local0
    maxconn 2048

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 5s
    timeout client 1m
    timeout server 1m

frontend mysql_in
    bind *:3306
    acl primary_degraded nbsrv(galera_primary) lt 2
    use_backend galera_failover if primary_degraded
    default_backend galera_primary

backend galera_primary
    mode tcp
    balance roundrobin
    option mysql-check user haproxy_check
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server db1 192.168.100.30:3306 check
    server db2 192.168.100.40:3306 check

backend galera_failover
    mode tcp
    balance roundrobin
    option mysql-check user haproxy_check
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server db1 192.168.100.30:3306 check
    server db2 192.168.100.40:3306 check
    server db3 192.168.100.50:3306 check

listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /
    stats refresh 5s

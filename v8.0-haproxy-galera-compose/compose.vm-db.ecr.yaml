name: ${COMPOSE_PROJECT_NAME:?Set COMPOSE_PROJECT_NAME in .env}

services:
  galera:
    image: ${MARIADB_IMAGE_URI:?Set MARIADB_IMAGE_URI in .env}
    container_name: galera-db
    hostname: ${GALERA_NODE_NAME:?Set GALERA_NODE_NAME in .env}
    restart: unless-stopped
    stop_grace_period: 2m
    network_mode: host
    environment:
      TZ: Asia/Seoul
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/mariadb_root_password
      MARIADB_ROOT_HOST: localhost
      MARIADB_DATABASE: ${MARIADB_DATABASE:?Set MARIADB_DATABASE in .env}
      MARIADB_USER: ${MARIADB_USER:?Set MARIADB_USER in .env}
      MARIADB_USER_HOST: "%"
      MARIADB_PASSWORD_FILE: /run/secrets/mariadb_app_password
      MARIADB_AUTO_UPGRADE: "1"
      GALERA_BOOTSTRAP: ${GALERA_BOOTSTRAP:-0}
    secrets:
      - mariadb_root_password
      - mariadb_app_password
      - mariadb_sst_password
    volumes:
      - galera_data:/var/lib/mysql
      - ./config/vm/60-galera-common.cnf:/etc/mysql/conf.d/60-galera-common.cnf:ro
    command:
      - mariadbd
      - --server-id=${GALERA_SERVER_ID:?Set GALERA_SERVER_ID in .env}
      - --wsrep-cluster-address=gcomm://${GALERA_CLUSTER_MEMBERS:?Set GALERA_CLUSTER_MEMBERS in .env}
      - --wsrep-node-name=${GALERA_NODE_NAME:?Set GALERA_NODE_NAME in .env}
      - --wsrep-node-address=${GALERA_NODE_ADDRESS:?Set GALERA_NODE_ADDRESS in .env}
      - --wsrep-node-incoming-address=${GALERA_NODE_ADDRESS:?Set GALERA_NODE_ADDRESS in .env}:3306
      - --wsrep-sst-receive-address=${GALERA_NODE_ADDRESS:?Set GALERA_NODE_ADDRESS in .env}:4444
      - --read-only=${GALERA_READ_ONLY:-ON}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$$(cat /run/secrets/mariadb_root_password)"
          mariadb --protocol=socket -uroot -Nse
          "SELECT CONCAT((SELECT VARIABLE_VALUE FROM information_schema.GLOBAL_STATUS WHERE VARIABLE_NAME='WSREP_READY'),':',(SELECT VARIABLE_VALUE FROM information_schema.GLOBAL_STATUS WHERE VARIABLE_NAME='WSREP_CONNECTED'),':',(SELECT VARIABLE_VALUE FROM information_schema.GLOBAL_STATUS WHERE VARIABLE_NAME='WSREP_LOCAL_STATE_COMMENT'));" 2>/dev/null
          | grep -qx "ON:ON:Synced"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

secrets:
  mariadb_root_password:
    file: ./secrets/root_password.txt
  mariadb_app_password:
    file: ./secrets/app_password.txt
  mariadb_sst_password:
    file: ./secrets/sst_password.txt

volumes:
  galera_data:
    name: ${COMPOSE_PROJECT_NAME:?Set COMPOSE_PROJECT_NAME in .env}-data
